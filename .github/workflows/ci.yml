name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B test
        working-directory: backend

  ui-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start backend (Flyway builds the schema)
        run: |
          nohup mvn -B spring-boot:run > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 3
          done
          curl -sf http://localhost:8080/actuator/health || (tail -50 backend.log; exit 1)
        working-directory: backend
        env:
          QUANTSIM_REFRESH_ENABLED: "false"
      - name: Seed synthetic market data
        run: |
          pip install pymysql
          python tools/ci_seed.py
      - name: Static UI audit
        run: python tools/ui_check.py
      - name: Run UI smoke
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run smoke
        working-directory: tools/ui_smoke
