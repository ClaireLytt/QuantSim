name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B test
        working-directory: backend
      # 覆盖率只观测不卡口 (阈值待一个周期的数据再定)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  # Python 质量: ruff + 纯逻辑 pytest (不起 Spark/MySQL, PySpark 本体逻辑本地手跑)
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install ruff pytest pandas numpy pymysql
      - name: Ruff lint
        run: ruff check --config data-pipeline/pyproject.toml data-pipeline tools
      - name: Run pipeline tests
        run: python -m pytest -q
        working-directory: data-pipeline

  ui-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start backend (Flyway builds the schema)
        run: |
          nohup mvn -B spring-boot:run > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 3
          done
          curl -sf http://localhost:8080/actuator/health || (tail -50 backend.log; exit 1)
        working-directory: backend
        env:
          QUANTSIM_REFRESH_ENABLED: "false"
      - name: Seed synthetic market data
        run: |
          python3 -m pip install pymysql
          python3 tools/ci_seed.py
      - name: Static UI audit
        run: python3 tools/ui_check.py
      - name: Frontend lint (eslint)
        run: |
          npm ci || npm install
          npm run lint
        working-directory: tools/ui_smoke
      - name: Run UI smoke
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run smoke
        working-directory: tools/ui_smoke
      # 失败证据链: 冒烟失败时上传失败步骤截图 + 后端日志, 不用盲猜挂在哪
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-evidence
          path: |
            tools/ui_smoke/fail-*.png
            backend/backend.log
          if-no-files-found: ignore
