name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR 连推时取消被取代的旧跑批, 省 runner; main 上的 push 不取消 (保完整记录)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # coverage_guard 需要 merge-base
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Wrapper self-test (包装脚本自身回归, 秒级前置)
        run: bash tools/test_run_mvn_test.sh
      - name: Run backend tests
        # 包装脚本: PIPESTATUS 透传 mvn 原生退出码 + 失败时打印用例摘要 (见 tools/run_mvn_test.sh 头注)
        run: bash ../tools/run_mvn_test.sh target/mvn-test.log 60
        working-directory: backend
      # 变更行覆盖率门禁 (CONSTRAINTS.md): 读 JaCoCo + git diff, 观察期只警告, 2026-11-07 后加 --strict
      - name: Changed-line coverage guard (warn)
        if: github.event_name == 'pull_request'
        run: python3 tools/coverage_guard.py --base origin/${{ github.base_ref }}
      # 覆盖率只观测不卡口 (阈值待一个周期的数据再定)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
      - name: Upload mvn full log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-test-log
          path: backend/target/mvn-test.log
          if-no-files-found: ignore

  # Floor 门禁 (CONSTRAINTS.md): 压制注释/跳测试/stub/放宽阈值/新例外, 阻断级
  floor-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要 merge-base
      - name: Floor guard
        run: node tools/floor_guard.mjs --base origin/${{ github.base_ref }}

  # 安全扫描 (CONSTRAINTS.md): 密钥阻断, 依赖漏洞观察期只警告
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks 扫全历史
      - name: Secret scan (gitleaks, block)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Dependency vulnerabilities (osv-scanner, warn)
        continue-on-error: true # 观察期 (CONSTRAINTS.md), 2026-11-07 后移除本行转阻断
        run: |
          curl -sSL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          ./osv-scanner scan source -r . --format table

  # Python 质量: ruff + 纯逻辑 pytest (不起 Spark/MySQL, PySpark 本体逻辑本地手跑)
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt
      - name: Install deps
        run: pip install ruff pytest pandas numpy pymysql
      - name: Ruff lint
        run: ruff check --config data-pipeline/pyproject.toml data-pipeline tools
      - name: Run pipeline tests
        run: python -m pytest -q
        working-directory: data-pipeline

  ui-smoke:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # 不配 npm 缓存: package-lock.json 被本仓有意 gitignore (前端零 npm 哲学),
          # CI 上解析不到会直接报错 (踩过一次)
      - name: Start backend (Flyway builds the schema)
        run: |
          nohup mvn -B spring-boot:run > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 3
          done
          curl -sf http://localhost:8080/actuator/health || (tail -50 backend.log; exit 1)
        working-directory: backend
        env:
          QUANTSIM_REFRESH_ENABLED: "false"
      - name: Seed synthetic market data
        run: |
          python3 -m pip install pymysql
          python3 tools/ci_seed.py
      - name: Static UI audit
        run: python3 tools/ui_check.py
      - name: Frontend lint (eslint)
        run: |
          npm ci || npm install
          npm run lint
        working-directory: tools/ui_smoke
      - name: Run UI smoke
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          npm run smoke
        working-directory: tools/ui_smoke
      # 失败证据链: 冒烟失败时上传失败步骤截图 + 后端日志, 不用盲猜挂在哪
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-evidence
          path: |
            tools/ui_smoke/fail-*.png
            backend/backend.log
          if-no-files-found: ignore
