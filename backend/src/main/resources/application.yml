server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${QUANTSIM_DB_HOST:127.0.0.1}:${QUANTSIM_DB_PORT:3306}/${QUANTSIM_DB_NAME:quantsim}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true
    username: ${QUANTSIM_DB_USER:root}
    password: ${QUANTSIM_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    type: caffeine
    cache-names: stockData
    caffeine:
      # 行情数据不可变, 缓存过期仅为管道重灌数据后能自动刷新
      spec: maximumSize=64,expireAfterWrite=10m
  web:
    resources:
      # 默认取 backend/ 目录下启动时的相对路径; 从别处启动 jar 时用环境变量指定绝对路径
      static-locations: file:${QUANTSIM_FRONTEND_DIR:../frontend}/, classpath:/static/

quantsim:
  game:
    initial-cash: 100000
    total-ticks: 20          # 每局交易日数, 到达后自动结算
    history-days: 60         # 开局时可见的历史交易日数
    min-history-days: 60     # 随机起点前至少要有的数据天数
    leaderboard-size: 20     # 两个排行榜的展示条数
    backtest-min-days: 30    # 回测要求的最少历史天数
    ai-buy-threshold: 0.55   # AI 上涨概率 ≥ 此值全仓买入
    ai-sell-threshold: 0.45  # AI 上涨概率 ≤ 此值清仓
  advisor:
    api-key: ${ANTHROPIC_API_KEY:}   # 未配置时「问问 Agent」功能自动禁用
    model: claude-haiku-4-5-20251001
    max-tokens: 500
    recent-days: 20          # 提供给 Agent 的近期 K 线天数
    timeout-seconds: 30
