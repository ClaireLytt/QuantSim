server:
  port: 8080
  servlet:
    session:
      timeout: 7d            # 登录态保持一周
      cookie:
        # Spring Session 默认叫 SESSION; 显式沿用 JSESSIONID, 与既有测试/文档保持一致
        name: JSESSIONID
        same-site: lax
        http-only: true

spring:
  datasource:
    url: jdbc:mysql://${QUANTSIM_DB_HOST:127.0.0.1}:${QUANTSIM_DB_PORT:3306}/${QUANTSIM_DB_NAME:quantsim}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8&createDatabaseIfNotExist=true
    username: ${QUANTSIM_DB_USER:root}
    password: ${QUANTSIM_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    # 会话落库 (SPRING_SESSION 表自动建): 发版重启不掉线, 多实例共享登录态
    store-type: jdbc
    timeout: 7d
    jdbc:
      initialize-schema: always
  cache:
    type: caffeine
    cache-names: stockData,newsByDate
    caffeine:
      # 行情数据不可变, 缓存过期仅为管道重灌数据后能自动刷新
      spec: maximumSize=64,expireAfterWrite=10m
  web:
    resources:
      # 默认取 backend/ 目录下启动时的相对路径; 从别处启动 jar 时用环境变量指定绝对路径
      static-locations: file:${QUANTSIM_FRONTEND_DIR:../frontend}/, classpath:/static/

# 只暴露健康检查, 供容器编排/反向代理探活; 其余 actuator 端点一律不开
management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  file:
    name: ${QUANTSIM_LOG_FILE:logs/quantsim.log}
  logback:
    rollingpolicy:
      max-history: 14

app:
  cors:
    # 前后端同源部署, 默认不开 CORS; 确需跨域时用环境变量配置显式白名单 (逗号分隔), 严禁上 *
    allowed-origins: ${QUANTSIM_CORS_ORIGINS:}

quantsim:
  game:
    initial-cash: 100000
    total-ticks: 20          # 每局交易日数, 到达后自动结算
    history-days: 60         # 开局时可见的历史交易日数
    min-history-days: 60     # 随机起点前至少要有的数据天数
    leaderboard-size: 20     # 两个排行榜的展示条数
    backtest-min-days: 30    # 回测要求的最少历史天数
    ai-buy-threshold: 0.55   # AI 上涨概率 ≥ 此值全仓买入
    ai-sell-threshold: 0.45  # AI 上涨概率 ≤ 此值清仓
  fees:
    stock:                    # A股: 万 2.5 佣金 (最低 5 元) + 千 0.5 印花税 (仅卖出)
      commission-rate: 0.00025
      min-commission: 5
      stamp-tax-rate: 0.0005
    us:                       # 美股: 万 5 佣金
      commission-rate: 0.0005
      min-commission: 0
      stamp-tax-rate: 0
    crypto:                   # 币圈: 千 1 佣金
      commission-rate: 0.001
      min-commission: 0
      stamp-tax-rate: 0
  refresh:
    # 上线保鲜: 每天凌晨自动跑数据管道 (增量拉取 -> 指标 -> 预测 -> 入库), 失败只记日志不影响游戏
    enabled: ${QUANTSIM_REFRESH_ENABLED:true}
    cron: "0 30 2 * * *"
    command: "python refresh.py"
    workdir: "../data-pipeline"
  advisor:
    api-key: ${ANTHROPIC_API_KEY:}   # 未配置时「问问 Agent」功能自动禁用
    model: claude-haiku-4-5-20251001
    max-tokens: 500
    recent-days: 20          # 提供给 Agent 的近期 K 线天数
    timeout-seconds: 30
    daily-limit: 300         # 全站 LLM 调用日配额 (成本硬顶), 超限当天禁用并提示明日再来
