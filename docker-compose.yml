# 一键启动: docker compose up -d           (MySQL + 后端, Flyway 自动建表)
# 灌数据:   docker compose --profile pipeline run --rm pipeline
# 生产部署: QUANTSIM_DB_PASSWORD=强密码 QUANTSIM_DOMAIN=你的域名 docker compose --profile prod up -d
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${QUANTSIM_DB_PASSWORD:-root}
      MYSQL_DATABASE: quantsim
    # 安全: 不把 3306 映射到宿主机, 只在 compose 内网可达; 本地调试需要时再临时加 ports
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      QUANTSIM_DB_HOST: mysql
      QUANTSIM_DB_PASSWORD: ${QUANTSIM_DB_PASSWORD:-root}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # 生产经 Caddy 反代时置 framework (Caddy 会覆写 XFF); 缺省 none 防伪造 IP 绕限流
      QUANTSIM_FORWARD_HEADERS: ${QUANTSIM_FORWARD_HEADERS:-none}
    ports:
      # 只绑回环: 本机调试照常 localhost:8080, 外网流量必须走 Caddy (直连绕过反代
      # 曾使伪造 XFF 可逐请求换 IP, 刷穿登录/游客/LLM 的全部按 IP 限流)
      - "${QUANTSIM_BACKEND_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # 生产入口: Caddy 反向代理, 配置 QUANTSIM_DOMAIN 后自动申请 HTTPS 证书
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      QUANTSIM_DOMAIN: ${QUANTSIM_DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      backend:
        condition: service_healthy

  # 一次性数据管道 (mock 数据 -> Spark 指标 -> 入库), 需后端先建好表
  pipeline:
    build: ./data-pipeline
    profiles: ["pipeline"]
    environment:
      QUANTSIM_DB_HOST: mysql
      QUANTSIM_DB_PASSWORD: ${QUANTSIM_DB_PASSWORD:-root}
    depends_on:
      backend:
        # 必须等健康检查过: service_started 不保证 Flyway 建完表, 管道会撞上空库
        condition: service_healthy

volumes:
  mysql-data:
  caddy-data:
